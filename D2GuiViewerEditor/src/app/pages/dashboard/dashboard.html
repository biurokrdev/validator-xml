<div class="dashboard-wrapper">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="brand">
        <img src="logo.svg" alt="Doc2 Logo" class="logo" />
        <span class="app-name">Doc2</span>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="hero">
      <h1 class="hero-title">{{ greeting() }}</h1>
      <p class="hero-subtitle">Moduł podglądu i edycji dokumentów</p>
    </div>

    @if (errorMessage()) {
      <div class="error-banner">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }

    @if (isLoading()) {
      <div class="loading-state">
        <span class="loading-spinner-lg"></span>
        <p class="loading-text">Trwa ładowanie&hellip;</p>
        <button class="cancel-link" (click)="cancelLoading()">Anuluj</button>
      </div>
    } @else {
      <div class="actions-grid">
        <button class="action-card" [class.disabled]="!canUseEditor()" [disabled]="!canUseEditor()" (click)="newDocument()">
          <div class="action-icon new-doc-icon">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
          </div>
          <span class="action-label">Nowy dokument</span>
        </button>

        <button class="action-card" [class.disabled]="!canUseEditor()" [disabled]="!canUseEditor()" (click)="openFile()">
          <div class="action-icon open-file-icon">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <span class="action-label">Otwórz plik</span>
        </button>

        <button class="action-card disabled" disabled>
          <div class="action-icon check-doc-icon">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span class="action-label">Sprawdź dokument</span>
          <span class="coming-soon-badge">Wkrótce</span>
        </button>
      </div>
    }
  </main>

  <footer class="dashboard-footer">
    <div class="footer-content">
      <span>Doc2 &copy; {{ currentYear }} Doc2</span>
      <span class="footer-sep">|</span>
      <span>Podgląd & edytor dokumentów</span>
    </div>
  </footer>
</div>
